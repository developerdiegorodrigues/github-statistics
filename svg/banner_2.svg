<svg xmlns="http://www.w3.org/2000/svg" class="nl-profile-banner" width="600" height="158" viewBox="0 0 600 158" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Banner de perfil</title>
  <desc id="desc">Foto de perfil de Diego Rodrigues sobre uma capa com padrão animado.</desc>
  <defs>
    <style>
      .nl-profile-banner {
        --nl-profile-banner-accent: #B14914;
        --nl-profile-banner-avatar-ring: #0d1117;
        --nl-smart-termite-shift-duration: 80s;
        --nl-smart-termite-filter-duration: 12s;
        --nl-profile-banner-avatar-duration: 500ms;
        --nl-profile-banner-avatar-delay: 0.5s;
      }

      .nl-profile-banner__accent-stop { stop-color: var(--nl-profile-banner-accent); }
      .nl-profile-banner__ring { fill: var(--nl-profile-banner-avatar-ring); }

      .nl-profile-banner__glow-x {
        animation: nl-profile-banner-glow-x linear infinite;
        animation-duration: calc(var(--nl-smart-termite-shift-duration) / 5);
      }

      .nl-profile-banner__glow-y {
        animation: nl-profile-banner-glow-y linear infinite;
        animation-duration: calc(var(--nl-smart-termite-shift-duration) / 2);
      }

      .nl-profile-banner__glow-hue {
        animation: nl-profile-banner-hue linear infinite;
        animation-duration: var(--nl-smart-termite-filter-duration);
      }

      .nl-profile-banner__avatar {
        transform-box: view-box;
        transform-origin: 300px 92.7837px;
        animation: nl-profile-banner-avatar-in var(--nl-profile-banner-avatar-duration)
          cubic-bezier(0.250, 0.460, 0.450, 0.940)
          var(--nl-profile-banner-avatar-delay) both;
      }

      @keyframes nl-profile-banner-glow-x {
        from { transform: translateX(0); }
        to   { transform: translateX(1200px); }
      }

      @keyframes nl-profile-banner-glow-y {
        from { transform: translateY(0); }
        to   { transform: translateY(-175.5674px); }
      }

      @keyframes nl-profile-banner-hue {
        from { filter: hue-rotate(0deg); }
        to   { filter: hue-rotate(360deg); }
      }

      @keyframes nl-profile-banner-avatar-in {
        from { opacity: 0; transform: perspective(400px) rotateY(-80deg); }
        to   { opacity: 1; transform: perspective(400px) rotateY(0deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .nl-profile-banner__glow-x,
        .nl-profile-banner__glow-y,
        .nl-profile-banner__glow-hue,
        .nl-profile-banner__avatar {
          animation: none;
        }
      }
    </style>

    <clipPath id="nl-profile-banner-cover-clip">
      <path d="M9.6 0 H585.6 A14.4 14.4 0 0 1 600 14.4 V73.3837 A14.4 14.4 0 0 1 585.6 87.7837 H9.6 A9.6 9.6 0 0 1 0 78.1837 V9.6 A9.6 9.6 0 0 1 9.6 0 Z"/>
    </clipPath>

    <clipPath id="nl-profile-banner-avatar-clip">
      <circle cx="300" cy="92.7837" r="54"/>
    </clipPath>

    <radialGradient id="nl-profile-banner-glow-gradient" gradientUnits="userSpaceOnUse" cx="600" cy="87.7837" r="606.3876">
      <stop offset="0" class="nl-profile-banner__accent-stop" stop-color="#B14914"/>
      <stop offset="0.6" stop-color="#151515"/>
      <stop offset="1" stop-color="#151515"/>
    </radialGradient>

    <pattern id="nl-profile-banner-glow" patternUnits="userSpaceOnUse" width="1200" height="175.5674">
      <rect width="1200" height="175.5674" fill="url(#nl-profile-banner-glow-gradient)"/>
    </pattern>

    <radialGradient id="nl-profile-banner-vignette" gradientUnits="userSpaceOnUse" cx="300" cy="43.8918" r="303.1938">
      <stop offset="0" stop-color="#151515" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#151515" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#151515" stop-opacity="1"/>
      <stop offset="1" stop-color="#151515" stop-opacity="1"/>
    </radialGradient>

    <pattern id="nl-profile-banner-mesh" patternUnits="userSpaceOnUse" width="7.92" height="13.7178">
      <g fill="none" stroke="#0d1117" stroke-width="0.66">
        <circle cx="3.96" cy="6.8589" r="3.63"/>
        <circle cx="0" cy="0" r="3.63"/>
        <circle cx="7.92" cy="0" r="3.63"/>
        <circle cx="0" cy="13.7178" r="3.63"/>
        <circle cx="7.92" cy="13.7178" r="3.63"/>
      </g>
    </pattern>
  </defs>

  <g clip-path="url(#nl-profile-banner-cover-clip)">
    <rect width="600" height="87.7837" fill="#0d1117"/>

    <g class="nl-profile-banner__glow-hue">
      <g class="nl-profile-banner__glow-x">
        <g class="nl-profile-banner__glow-y">
          <rect x="-1200" y="-175.5674" width="2400" height="526.7022" fill="url(#nl-profile-banner-glow)"/>
        </g>
      </g>
    </g>

    <rect width="600" height="87.7837" fill="url(#nl-profile-banner-vignette)"/>
    <rect width="600" height="87.7837" fill="url(#nl-profile-banner-mesh)"/>
  </g>

  <circle cx="300" cy="92.7837" r="60" fill="#0d1117"/>

  <g class="nl-profile-banner__avatar">
    <circle class="nl-profile-banner__ring" cx="300" cy="92.7837" r="60" fill="#0d1117"/>
    <image x="246" y="38.7837" width="108" height="108" preserveAspectRatio="xMidYMid slice" clip-path="url(#nl-profile-banner-avatar-clip)" href="data:image/webp;base64,"/>
  </g>
</svg>
