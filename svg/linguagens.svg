<svg xmlns="http://www.w3.org/2000/svg" width="480" height="182" viewBox="0 0 480 182" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Linguagens mais usadas</title>
  <desc id="desc">Linguagens mais usadas: TypeScript 35,2%, Java 30,9%, HTML 13,9%, CSS 9,2%, Python 7,2%, C++ 1,5%, Outras 1,9%.</desc>
  <style>
    svg { --fundo: #0d1117; --superficie: #161b22; --borda: #30363d; --texto: #e6edf3; --textofraco: #8b949e; --destaque: #2f81f7; --chama: #f0883e; --sucesso: #3fb950; }
    @media (prefers-color-scheme: light) {
      svg { --fundo: #ffffff; --superficie: #f6f8fa; --borda: #d1d9e0; --texto: #1f2328; --textofraco: #59636e; --destaque: #0969da; --chama: #bc4c00; --sucesso: #1a7f37; }
    }

    text { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .titulo      { font-size: 15px; font-weight: 600; fill: var(--texto); }
    .numero      { font-size: 26px; font-weight: 700; fill: var(--texto); }
    .numero-mini { font-size: 13px; font-weight: 600; fill: var(--texto); }
    .rotulo      { font-size: 12px; font-weight: 600; fill: var(--texto); }
    .legenda     { font-size: 11px; font-weight: 400; fill: var(--textofraco); }
    .item        { font-size: 12px; font-weight: 400; fill: var(--texto); }

    @keyframes surgir {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes crescer {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    /*
     * "backwards" (e nao "forwards") e deliberado: o estado padrao do elemento
     * e visivel, e o fade so e aplicado enquanto a animacao roda. Assim, num
     * renderizador que ignore animacoes, o card aparece montado em vez de vazio.
     * A animacao tambem nao toca em transform, que em SVG sobrescreveria o
     * atributo transform de posicionamento do elemento.
     */
    .anim   { animation: surgir 0.45s ease-out backwards; }
    .cresce { transform-origin: left center; animation: crescer 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards; }

    /* Quem pediu menos movimento vê o card já montado, sem animação. */
    @media (prefers-reduced-motion: reduce) {
      .anim, .cresce { animation: none; }
    }

  </style>
  <rect x="0.5" y="0.5" width="479" height="181" rx="8" fill="var(--fundo)" stroke="var(--borda)"/>
    <defs><clipPath id="recorte-barra"><rect x="0" y="0" width="440" height="12" rx="6"/></clipPath></defs>
    <text class="titulo anim" style="animation-delay: 0.10s" x="20" y="34">Linguagens mais usadas</text>
    <g transform="translate(20 48)" clip-path="url(#recorte-barra)">
      <g class="cresce" style="animation-delay: 0.15s">
      <rect x="0.00" y="0" width="155.08" height="12" fill="#3178c6"/>
      <rect x="155.08" y="0" width="136.16" height="12" fill="#b07219"/>
      <rect x="291.24" y="0" width="61.34" height="12" fill="#e34c26"/>
      <rect x="352.57" y="0" width="40.45" height="12" fill="#663399"/>
      <rect x="393.03" y="0" width="31.85" height="12" fill="#3572A5"/>
      <rect x="424.87" y="0" width="6.67" height="12" fill="#f34b7d"/>
      <rect x="431.55" y="0" width="8.45" height="12" fill="var(--textofraco)"/>
      </g>
    </g>
    <g class="anim" style="animation-delay: 0.35s">
      <circle cx="24" cy="84" r="4.5" fill="#3178c6"/>
      <text class="item" x="37" y="88">TypeScript</text>
      <text class="legenda" x="216" y="88" text-anchor="end">35,2%</text>
    </g>
    <g class="anim" style="animation-delay: 0.41s">
      <circle cx="24" cy="108" r="4.5" fill="#b07219"/>
      <text class="item" x="37" y="112">Java</text>
      <text class="legenda" x="216" y="112" text-anchor="end">30,9%</text>
    </g>
    <g class="anim" style="animation-delay: 0.47s">
      <circle cx="24" cy="132" r="4.5" fill="#e34c26"/>
      <text class="item" x="37" y="136">HTML</text>
      <text class="legenda" x="216" y="136" text-anchor="end">13,9%</text>
    </g>
    <g class="anim" style="animation-delay: 0.53s">
      <circle cx="24" cy="156" r="4.5" fill="#663399"/>
      <text class="item" x="37" y="160">CSS</text>
      <text class="legenda" x="216" y="160" text-anchor="end">9,2%</text>
    </g>
    <g class="anim" style="animation-delay: 0.59s">
      <circle cx="256" cy="84" r="4.5" fill="#3572A5"/>
      <text class="item" x="269" y="88">Python</text>
      <text class="legenda" x="448" y="88" text-anchor="end">7,2%</text>
    </g>
    <g class="anim" style="animation-delay: 0.65s">
      <circle cx="256" cy="108" r="4.5" fill="#f34b7d"/>
      <text class="item" x="269" y="112">C++</text>
      <text class="legenda" x="448" y="112" text-anchor="end">1,5%</text>
    </g>
    <g class="anim" style="animation-delay: 0.71s">
      <circle cx="256" cy="132" r="4.5" fill="var(--textofraco)"/>
      <text class="item" x="269" y="136">Outras</text>
      <text class="legenda" x="448" y="136" text-anchor="end">1,9%</text>
    </g>
</svg>
