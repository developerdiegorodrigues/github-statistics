<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Contribuições no GitHub</title>
  <desc id="desc">1.781 contribuições desde 5 jan 2020. Sequência atual de 1 dia. Maior sequência de 13 dias.</desc>
  <style>
    svg { --fundo: #0d1117; --superficie: #161b22; --borda: #30363d; --texto: #e6edf3; --textofraco: #8b949e; --destaque: #2f81f7; --chama: #f0883e; --sucesso: #3fb950; }
    @media (prefers-color-scheme: light) {
      svg { --fundo: #ffffff; --superficie: #f6f8fa; --borda: #d1d9e0; --texto: #1f2328; --textofraco: #59636e; --destaque: #0969da; --chama: #bc4c00; --sucesso: #1a7f37; }
    }

    text { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .titulo      { font-size: 15px; font-weight: 600; fill: var(--texto); }
    .numero      { font-size: 26px; font-weight: 700; fill: var(--texto); }
    .numero-mini { font-size: 13px; font-weight: 600; fill: var(--texto); }
    .rotulo      { font-size: 12px; font-weight: 600; fill: var(--texto); }
    .legenda     { font-size: 11px; font-weight: 400; fill: var(--textofraco); }
    .item        { font-size: 12px; font-weight: 400; fill: var(--texto); }

    @keyframes surgir {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes crescer {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    /*
     * "backwards" (e nao "forwards") e deliberado: o estado padrao do elemento
     * e visivel, e o fade so e aplicado enquanto a animacao roda. Assim, num
     * renderizador que ignore animacoes, o card aparece montado em vez de vazio.
     * A animacao tambem nao toca em transform, que em SVG sobrescreveria o
     * atributo transform de posicionamento do elemento.
     */
    .anim   { animation: surgir 0.45s ease-out backwards; }
    .cresce { transform-origin: left center; animation: crescer 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards; }

    /* Quem pediu menos movimento vê o card já montado, sem animação. */
    @media (prefers-reduced-motion: reduce) {
      .anim, .cresce { animation: none; }
    }

  </style>
  <rect x="0.5" y="0.5" width="479" height="149" rx="8" fill="var(--fundo)" stroke="var(--borda)"/>
    <line x1="160" y1="26" x2="160" y2="124" stroke="var(--borda)" stroke-width="1"/>
    <line x1="320" y1="26" x2="320" y2="124" stroke="var(--borda)" stroke-width="1"/>
    <g transform="translate(71 25) scale(0.75)" fill="var(--destaque)"><g class="anim" style="animation-delay: 0.10s"><rect x="2" y="2" width="6" height="6" rx="1.5"/><rect x="9" y="2" width="6" height="6" rx="1.5"/><rect x="16" y="2" width="6" height="6" rx="1.5"/><rect x="2" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/><rect x="16" y="9" width="6" height="6" rx="1.5"/><rect x="2" y="16" width="6" height="6" rx="1.5"/><rect x="9" y="16" width="6" height="6" rx="1.5"/><rect x="16" y="16" width="6" height="6" rx="1.5"/></g></g>
    <text class="numero anim" style="animation-delay: 0.18s" x="80" y="86" text-anchor="middle">1.781</text>
    <text class="rotulo anim" style="animation-delay: 0.18s" x="80" y="108" text-anchor="middle">Contribuições</text>
    <text class="legenda anim" style="animation-delay: 0.26s" x="80" y="127" text-anchor="middle">desde 5 jan 2020</text>
    <g transform="translate(231 25) scale(0.75)" fill="var(--chama)"><g class="anim" style="animation-delay: 0.34s"><path d="M12 2.2c.6 2.9 2.4 4.3 3.9 6.1 1.5 1.8 2.1 3.5 2.1 5.4a6 6 0 1 1-12 0c0-1.1.3-2.2.9-3.1.3 1.2 1.1 2 2.1 2 1.3 0 2.1-1 2.1-2.5 0-1.9-1.2-2.9-1.2-4.8 0-1.2.7-2.4 2.1-3.1z"/></g></g>
    <text class="numero anim" style="animation-delay: 0.42s" x="240" y="86" text-anchor="middle">1</text>
    <text class="rotulo anim" style="animation-delay: 0.42s" x="240" y="108" text-anchor="middle">Sequência atual</text>
    <text class="legenda anim" style="animation-delay: 0.50s" x="240" y="127" text-anchor="middle">17 set</text>
    <g transform="translate(391 25) scale(0.75)" fill="var(--sucesso)"><g class="anim" style="animation-delay: 0.58s"><path d="M12 2.5l2.9 5.9 6.6.9-4.8 4.6 1.1 6.5-5.8-3-5.8 3 1.1-6.5L2.5 9.3l6.6-.9z"/></g></g>
    <text class="numero anim" style="animation-delay: 0.66s" x="400" y="86" text-anchor="middle">13</text>
    <text class="rotulo anim" style="animation-delay: 0.66s" x="400" y="108" text-anchor="middle">Maior sequência</text>
    <text class="legenda anim" style="animation-delay: 0.74s" x="400" y="127" text-anchor="middle">15 ago – 27 ago</text>
</svg>
