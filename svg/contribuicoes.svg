<svg xmlns="http://www.w3.org/2000/svg" width="480" height="168" viewBox="0 0 480 168" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Contribuições no GitHub</title>
  <desc id="desc">1.987 contribuições desde 5 jan 2020. Sequência atual de 8 dias. Maior sequência de 17 dias.</desc>
  <style>
    svg { --fundo: #0d1117; --superficie: #161b22; --borda: #30363d; --texto: #e6edf3; --textofraco: #8b949e; --destaque: #2f81f7; --chama: #f0883e; --sucesso: #3fb950; }
    @media (prefers-color-scheme: light) {
      svg { --fundo: #ffffff; --superficie: #f6f8fa; --borda: #d1d9e0; --texto: #1f2328; --textofraco: #59636e; --destaque: #0969da; --chama: #bc4c00; --sucesso: #1a7f37; }
    }

    text { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .titulo      { font-size: 15px; font-weight: 600; fill: var(--texto); }
    .numero      { font-size: 26px; font-weight: 700; fill: var(--texto); }
    .numero-mini { font-size: 13px; font-weight: 600; fill: var(--texto); }
    .rotulo      { font-size: 12px; font-weight: 600; fill: var(--texto); }
    .legenda     { font-size: 11px; font-weight: 400; fill: var(--textofraco); }
    .item        { font-size: 12px; font-weight: 400; fill: var(--texto); }

    @keyframes surgir {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes crescer {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    .anim   { animation: surgir 0.45s ease-out backwards; }
    .cresce { transform-origin: left center; animation: crescer 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards; }

    @media (prefers-reduced-motion: reduce) {
      .anim, .cresce { animation: none; }
    }

  </style>
  <rect x="0.5" y="0.5" width="479" height="167" rx="8" fill="var(--fundo)" stroke="var(--borda)"/>
    <line x1="160" y1="24" x2="160" y2="144" stroke="var(--borda)" stroke-width="1"/>
    <line x1="320" y1="24" x2="320" y2="144" stroke="var(--borda)" stroke-width="1"/>
    <g transform="translate(59 68) scale(0.04375)" fill="var(--destaque)"><g class="anim" style="animation-delay: 0.10s"><path d="M440-440v120q0 17 11.5 28.5T480-280q17 0 28.5-11.5T520-320v-120h120q17 0 28.5-11.5T680-480q0-17-11.5-28.5T640-520H520v-120q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640v120H320q-17 0-28.5 11.5T280-480q0 17 11.5 28.5T320-440h120ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Z"/></g></g>
    <text class="numero anim" style="animation-delay: 0.18s" x="80" y="102" text-anchor="middle">1.987</text>
    <text class="rotulo anim" style="animation-delay: 0.18s" x="80" y="124" text-anchor="middle">Contribuições</text>
    <text class="legenda anim" style="animation-delay: 0.26s" x="80" y="143" text-anchor="middle">desde 5 jan 2020</text>
    <g transform="translate(212.5 68) scale(0.057291666666666664)" fill="var(--chama)"><g class="anim" style="animation-delay: 0.34s"><path d="M160-400q0-113 67-217t184-182q22-15 45.5-1.5T480-760v52q0 34 23.5 57t57.5 23q17 0 32.5-7.5T621-657q8-10 20.5-12.5T665-664q63 45 99 115t36 149q0 88-43 160.5T644-125q17-24 26.5-52.5T680-238q0-40-15-75.5T622-377L480-516 339-377q-29 29-44 64t-15 75q0 32 9.5 60.5T316-125q-70-42-113-114.5T160-400Zm320-4 85 83q17 17 26 38t9 45q0 49-35 83.5T480-120q-50 0-85-34.5T360-238q0-23 9-44.5t26-38.5l85-83Z"/></g></g>
    <text class="numero anim" style="animation-delay: 0.42s" x="240" y="102" text-anchor="middle">8</text>
    <text class="rotulo anim" style="animation-delay: 0.42s" x="240" y="124" text-anchor="middle">Sequência atual</text>
    <text class="legenda anim" style="animation-delay: 0.50s" x="240" y="143" text-anchor="middle">17 set</text>
    <g transform="translate(380.5 68) scale(0.040625)" fill="var(--sucesso)"><g class="anim" style="animation-delay: 0.58s"><path d="m305-704 112-145q12-16 28.5-23.5T480-880q18 0 34.5 7.5T543-849l112 145 170 57q26 8 41 29.5t15 47.5q0 12-3.5 24T866-523L756-367l4 164q1 35-23 59t-56 24q-2 0-22-3l-179-50-179 50q-5 2-11 2.5t-11 .5q-32 0-56-24t-23-59l4-165L95-523q-8-11-11.5-23T80-570q0-25 14.5-46.5T135-647l170-57Z"/></g></g>
    <text class="numero anim" style="animation-delay: 0.66s" x="400" y="102" text-anchor="middle">17</text>
    <text class="rotulo anim" style="animation-delay: 0.66s" x="400" y="124" text-anchor="middle">Maior sequência</text>
    <text class="legenda anim" style="animation-delay: 0.74s" x="400" y="143" text-anchor="middle">29 ago – 14 set</text>
</svg>
